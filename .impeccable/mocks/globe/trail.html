<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAIRN · Globe, trail signs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<!-- MapLibre GL JS (https://maplibre.org, BSD-3-Clause): same library the app already uses -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="trail.css">
</head>
<body class="is-intro">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="g-easy" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.2" fill="currentColor"/></symbol>
    <symbol id="g-moderate" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="currentColor"/></symbol>
    <symbol id="g-hard" viewBox="0 0 10 10"><path d="M5 0.4 9.6 5 5 9.6 0.4 5z" fill="currentColor"/></symbol>
    <symbol id="g-strenuous" viewBox="0 0 16 10"><path d="M4.6 0.4 9.2 5 4.6 9.6 0 5zM11.4 0.4 16 5 11.4 9.6 6.8 5z" fill="currentColor"/></symbol>
    <symbol id="g-none" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="i-cairn" viewBox="0 0 24 24"><g fill="currentColor"><ellipse cx="12" cy="20" rx="8" ry="2.4"/><ellipse cx="12" cy="15.2" rx="6" ry="2.2"/><ellipse cx="12" cy="10.6" rx="4.4" ry="2"/><ellipse cx="12" cy="6.4" rx="3" ry="1.8"/><ellipse cx="12" cy="3" rx="1.6" ry="1.2"/></g></symbol>
  </defs>
</svg>

<header class="nav">
  <div class="wrap nav-inner">
    <nav class="nav-group" aria-label="Explore">
      <a class="nav-link" href="../landing/l1-summit.html">Home</a>
      <a class="nav-link" href="../browse/routes.html">Browse routes</a>
      <a class="nav-link is-current" href="#" aria-current="page">Globe</a>
    </nav>
    <a class="brand" href="../landing/l1-summit.html" aria-label="CAIRN home"><span class="brand-mark"><svg><use href="#i-cairn"/></svg></span>CAIRN</a>
    <nav class="nav-group is-right" aria-label="Account">
      <a class="nav-link is-solid" href="#">Sign in</a>
      <a class="nav-link is-pine" href="#">Take the quiz</a>
    </nav>
  </div>
</header>

<main class="globe-page">
  <!-- Contour lines of an imaginary range, behind the globe like the paper of a topo map -->
  <svg class="contours" id="contours" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <div id="globe" class="globe-surface" role="region" aria-label="Interactive globe" aria-roledescription="3D globe"></div>
  <div class="shade" aria-hidden="true"></div>

  <!-- Intro: a cairn built stone by stone as the page loads, then a sign pointing at the globe -->
  <section class="intro" id="intro">
    <h1 class="intro-title" aria-label="CAIRN"><span>C</span><span>A</span><span>I</span><span>R</span><span>N</span></h1>
    <p class="intro-tagline">Find your next trail.</p>
    <div class="intro-way">
      <svg class="intro-cairn" id="intro-cairn" viewBox="0 0 120 96" role="progressbar" aria-label="Loading routes" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <ellipse class="stone" cx="60" cy="84" rx="46" ry="11" fill="#8d8f88"/>
        <ellipse class="stone" cx="58" cy="66" rx="33" ry="10" fill="#a8a89f"/>
        <ellipse class="stone" cx="62" cy="49" rx="24" ry="9" fill="#969890"/>
        <ellipse class="stone" cx="59" cy="33" rx="16" ry="7.5" fill="#bcbbb1"/>
        <ellipse class="stone" cx="60" cy="20" rx="9" ry="5.5" fill="#d3d1c6"/>
      </svg>
      <p class="intro-status" id="intro-status" role="status"><span id="loading-msg">Loading routes</span> <span class="data" id="loading-pct">0%</span></p>
      <button class="intro-sign" id="explore" type="button" hidden data-testid="globe-explore-button">
        <span class="plank is-big is-right">Explore the globe</span>
        <span class="post" aria-hidden="true"></span>
      </button>
    </div>
  </section>

  <!-- The route index as a trailhead notice board, standing on the bottom of the screen -->
  <aside class="board" id="board" aria-label="Route index" data-testid="globe-panel">
    <span class="board-roof" aria-hidden="true"></span>
    <button class="board-toggle" id="board-toggle" type="button" aria-expanded="false" aria-controls="board-sheet" data-testid="globe-panel-toggle">
      <span><b class="data" id="count-shown">0</b> routes</span>
      <span class="board-toggle-label">Trail board<svg><use href="#i-plus"/></svg></span>
    </button>
    <div class="board-sheet" id="board-sheet">
      <div class="board-head">
        <h2>Trailhead board</h2>
        <p class="data" data-testid="globe-route-count"><span id="count-total">0</span> routes · <span id="count-countries">0</span> countries</p>
      </div>
      <p class="label">This way to</p>
      <ol class="ways" id="ways"></ol>
      <p class="label">Trail blazes</p>
      <ul class="blazes" id="blazes"></ul>
      <p class="label" id="map-type">Map</p>
      <div class="switch" role="group" aria-labelledby="map-type">
        <button type="button" aria-pressed="false" data-map="map" data-testid="globe-map-view-button">Map</button>
        <button type="button" aria-pressed="true" data-map="satellite" data-testid="globe-satellite-view-button">Satellite</button>
      </div>
    </div>
  </aside>

  <!-- A compass that really follows the map, and zoom buttons -->
  <div class="cam" role="group" aria-label="Camera">
    <button class="compass" id="reset" type="button" aria-label="Face north and go back to all routes" data-testid="globe-reset-view">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#fbfaf7" stroke="#17201c" stroke-width="3"/>
        <g id="compass-card">
          <path d="M32 7v6M32 51v6M7 32h6M51 32h6" stroke="#17201c" stroke-width="2"/>
          <path d="M32 13 39 32H25z" fill="#c2481a"/>
          <path d="M32 51 25 32h14z" fill="#3a4540"/>
        </g>
        <circle cx="32" cy="32" r="3" fill="#fbfaf7" stroke="#17201c" stroke-width="1.5"/>
      </svg>
    </button>
    <div class="zoom">
      <button id="zoom-in" type="button" aria-label="Zoom in" data-testid="globe-zoom-in"><svg><use href="#i-plus"/></svg></button>
      <button id="zoom-out" type="button" aria-label="Zoom out" data-testid="globe-zoom-out"><svg><use href="#i-minus"/></svg></button>
    </div>
  </div>

  <!-- Where the camera is, like the readout on a GPS unit, with a map scale -->
  <div class="readout" id="readout" aria-hidden="true"><span class="data" id="readout-pos"></span></div>

  <!-- A page of field notes pinned up beside the sign -->
  <article class="card" id="card" hidden data-testid="route-card"></article>

  <div class="dive" id="dive" role="status">
    <div class="dive-inner">
      <p class="dive-label">Heading to the trailhead</p>
      <p class="dive-name" id="dive-name"></p>
      <svg class="dive-trail" viewBox="0 0 400 20" preserveAspectRatio="none" aria-hidden="true"><path d="M4 12C70 2 120 18 190 10S320 4 396 12"/></svg>
    </div>
  </div>
</main>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="../browse/routes-data.js"></script>
<script src="trail.js"></script>
</body>
</html>
